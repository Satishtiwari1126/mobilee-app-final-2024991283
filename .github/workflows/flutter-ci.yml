name: RASA Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Analyze, test, and build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true

      # The repository initially contains Dart source only. Generate the
      # Android host project in the CI workspace so the APK can be verified.
      - name: Generate Android platform files
        run: flutter create . --platforms=android --org com.satishtiwari1126 --project-name rasa

      - name: Configure Android internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          content = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in content:
              content = content.replace('<manifest ', '<manifest ', 1)
              marker = '<application'
              content = content.replace(marker, f'    {permission}\n    {marker}', 1)
              manifest.write_text(content)
          PY

      - name: Remove generated placeholder test
        run: rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Format Dart source
        run: dart format .

      - name: Analyze Dart source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug
